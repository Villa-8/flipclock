<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEON HACKER ESCAPE — Comic Password Gauntlet</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #ff00aa;
      --neon-cyan: #00ffff;
      --neon-purple: #aa00ff;
      --dark: #0a0015;
      --dark-2: #140028;
      --text: #e0e0ff;
      --error: #ff3366;
      --success: #33ffaa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(170,0,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,255,0.06) 0%, transparent 50%);
    }
    #container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(20,0,40,0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(170,0,255,0.25);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 0 60px rgba(170,0,255,0.15);
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      text-align: center;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 20px rgba(255,0,170,0.6);
    }
    .subtitle {
      text-align: center;
      color: #a0a0ff;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .input-group {
      margin: 1.5rem 0;
    }
    label {
      display: block;
      margin-bottom: 0.6rem;
      font-weight: 500;
      color: var(--neon-cyan);
    }
    textarea {
      width: 100%;
      min-height: 70px;
      padding: 1rem;
      font-size: 1.2rem;
      font-family: 'Orbitron', monospace;
      background: rgba(10,0,30,0.7);
      border: 2px solid rgba(0,255,255,0.3);
      border-radius: 10px;
      color: var(--neon-cyan);
      resize: vertical;
      transition: all 0.25s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255,0,170,0.4);
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    button {
      padding: 0.9rem 1.8rem;
      font-size: 1.05rem;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
    }
    #hintBtn {
      background: linear-gradient(45deg, #00aaff, #00ffcc);
      color: #000;
      font-weight: 700;
    }
    #buyBtn {
      background: linear-gradient(45deg, #ff00aa, #aa00ff);
      color: white;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,255,255,0.3);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #hintText {
      display: none;
      margin: 1.2rem 0;
      padding: 1.2rem;
      background: rgba(0,255,170,0.12);
      border: 1px solid var(--success);
      border-radius: 10px;
      color: var(--success);
      font-weight: 500;
    }
    #rules {
      margin-top: 2rem;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .rule-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      margin: 0.6rem 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(170,0,255,0.2);
      transition: all 0.3s;
    }
    .rule-item.ok {
      background: rgba(51,255,170,0.12);
      border-color: var(--success);
    }
    .rule-item.fail {
      background: rgba(255,51,102,0.12);
      border-color: var(--error);
      animation: shake 0.4s;
    }
    .status {
      font-size: 1.8rem;
      min-width: 40px;
      text-align: center;
    }
    .rule-text {
      flex: 1;
      font-size: 1.05rem;
    }
    .rule-text a {
      color: var(--neon-cyan);
      text-decoration: underline;
    }
    #victory {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
      animation: fadeIn 1.5s;
    }
    #victory h2 {
      font-size: 2.8rem;
      background: linear-gradient(90deg, #ff00aa, #00ffff, #aa00ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @media (max-width: 640px) {
      #container { padding: 1.5rem; }
      h1 { font-size: 2.4rem; }
      .rule-item { font-size: 0.95rem; padding: 0.9rem; }
    }
  </style>
</head>
<body>

<div id="container">
  <h1>NEON HACKER ESCAPE</h1>
  <div class="subtitle">21-rule cyber gauntlet • Beat it → DM <strong>@josephkerala</strong> screenshot for prize</div>

  <div class="input-group">
    <label>YOUR HACK CODE</label>
    <textarea id="password" placeholder="start typing your illegal access string..." autofocus></textarea>
  </div>

  <div id="controls">
    <button id="hintBtn">SHOW HINT (<span id="hintCount">5</span>)</button>
    <button id="buyHintBtn" style="display:none;">BUY HINT (visit sponsor)</button>
  </div>

  <div id="hintText"></div>

  <div id="rules"></div>

  <div id="victory">
    <h2>ACCESS GRANTED — YOU OWN THE MATRIX</h2>
    <p style="font-size:1.4rem; margin:2rem 0;">
      Legendary run! 🎉<br>
      Screenshot this screen + your final code<br>
      DM <strong>@josephkerala</strong> on Instagram → claim your prize
    </p>
    <button onclick="location.reload()">NEW RUN?</button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  NEW RULES — completely different set
// ──────────────────────────────────────────────

const RULES = [
  { id:1,  text: "At least 9 characters long",                 check: s => s.length >= 9 },
  { id:2,  text: "Must contain at least 1 emoji",              check: s => /[\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/u.test(s) },
  { id:3,  text: "Must include your city name (lowercase)",    check: s => s.toLowerCase().includes("malappuram") || s.toLowerCase().includes("kerala") },
  { id:4,  text: "Contains a power of 2 between 8–512",        check: s => {
      const nums = s.match(/\d+/g) || [];
      return nums.some(n => {
        let v = Number(n);
        return v >= 8 && v <= 512 && Number.isInteger(Math.log2(v));
      });
    }},
  { id:5,  text: "Has exactly 3 vowels (a e i o u)",           check: s => (s.match(/[aeiou]/gi) || []).length === 3 },
  { id:6,  text: "Includes today's weekday (lowercase)",       check: s => {
      const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
      const today = new Date().toLocaleString('en-US',{weekday:'long'}).toLowerCase();
      return s.toLowerCase().includes(today);
    }},
  { id:7,  text: "Contains a palindrome ≥ 5 letters",          check: s => {
      const words = s.match(/[a-zA-Z]+/g) || [];
      return words.some(w => {
        let str = w.toLowerCase();
        return str.length >= 5 && str === str.split('').reverse().join('');
      });
    }},
  { id:8,  text: "Must contain 'neon' or 'cyber'",             check: s => /neon|cyber/i.test(s) },
  { id:9,  text: "Digits sum to a multiple of 9",              check: s => {
      const sum = (s.match(/\d/g) || []).reduce((a,c)=>a+Number(c),0);
      return sum > 0 && sum % 9 === 0;
    }},
  { id:10, text: "Has more consonants than vowels",            check: s => {
      const cons = (s.match(/[^aeiou\s\W]/gi) || []).length;
      const vows = (s.match(/[aeiou]/gi) || []).length;
      return cons > vows;
    }},
  { id:11, text: "Includes a hex color code (# + 6 chars)",    check: s => /#[0-9a-fA-F]{6}/.test(s) },
  { id:12, text: "Contains '2026' (this year)",                check: s => s.includes("2026") },
  { id:13, text: () => `Includes current minute padded (e.g. ${new Date().getMinutes().toString().padStart(2,'0')})`, 
           check: s => s.includes(new Date().getMinutes().toString().padStart(2,'0')) },
  { id:14, text: "Has at least one repeated letter 3+ times",  check: s => {
      const counts = {};
      for (let c of s.toLowerCase()) if(/[a-z]/.test(c)) counts[c] = (counts[c]||0)+1;
      return Object.values(counts).some(v => v >= 3);
    }},
  { id:15, text: "Must include a music note emoji ♫ ♪",        check: s => /♫|♪/.test(s) },
  { id:16, text: "Length is a prime number",                   check: s => {
      const n = s.length;
      if (n < 2) return false;
      for (let i = 2; i*i <= n; i++) if (n % i === 0) return false;
      return true;
    }},
  { id:17, text: "Contains your age or birth year hint",       check: s => s.match(/\d{2,4}/) }, // loose
  { id:18, text: "All words start with different letters",     check: s => {
      const words = s.match(/[a-zA-Z]+/g) || [];
      if (words.length < 2) return true;
      const starts = words.map(w => w[0].toLowerCase());
      return new Set(starts).size === starts.length;
    }},
  { id:19, text: "Includes a retro game name (mario, tetris, pacman, pong…)", check: s => /mario|tetris|pacman|pong|sonic|zelda/i.test(s) },
  { id:20, text: "Final challenge — must contain 'ACCESS' uppercase", check: s => s.includes("ACCESS") }
];

const MAX_RULES_SHOWN = 20;
let currentMaxRule = 0;
let hintsLeft = 5;
let hintsBoughtToday = 0;
let lastHintDate = localStorage.getItem("lastHintDate") || "";
const today = new Date().toDateString();

if (lastHintDate !== today) {
  hintsLeft = 5;
  hintsBoughtToday = 0;
  localStorage.setItem("lastHintDate", today);
  localStorage.setItem("hintsLeft", "5");
  localStorage.setItem("hintsBoughtToday", "0");
} else {
  hintsLeft = parseInt(localStorage.getItem("hintsLeft") || "5");
  hintsBoughtToday = parseInt(localStorage.getItem("hintsBoughtToday") || "0");
}

const pwInput = document.getElementById("password");
const rulesDiv  = document.getElementById("rules");
const hintBtn   = document.getElementById("hintBtn");
const buyBtn    = document.getElementById("buyHintBtn");
const hintCount = document.getElementById("hintCount");
const hintText  = document.getElementById("hintText");
const victory   = document.getElementById("victory");

hintCount.textContent = hintsLeft;

function updateHintsUI() {
  hintCount.textContent = hintsLeft;
  hintBtn.disabled = hintsLeft <= 0;
  buyBtn.style.display = (hintsLeft <= 0 && hintsBoughtToday < 3) ? "inline-block" : "none";
}

function saveHints() {
  localStorage.setItem("hintsLeft", hintsLeft);
  localStorage.setItem("hintsBoughtToday", hintsBoughtToday);
}

hintBtn.onclick = () => {
  if (hintsLeft > 0) {
    hintsLeft--;
    saveHints();
    updateHintsUI();
    showCurrentHint();
  }
};

buyBtn.onclick = () => {
  window.open("https://x.ai", "_blank");
  setTimeout(() => {
    if (confirm("Did you visit the sponsor page? Get +1 hint?")) {
      hintsBoughtToday++;
      hintsLeft++;
      saveHints();
      updateHintsUI();
      alert("Hint added! Keep hacking.");
    }
  }, 3500);
};

function showCurrentHint() {
  if (currentMaxRule < RULES.length) {
    const next = RULES[currentMaxRule];
    let txt = typeof next.text === "function" ? next.text() : next.text;
    hintText.innerHTML = `Next rule hint:<br><strong>${txt}</strong>`;
    hintText.style.display = "block";
  }
}

function evaluate() {
  const val = pwInput.value;
  let maxPassed = 0;

  for (let i = 0; i < RULES.length; i++) {
    const rule = RULES[i];
    const ok = rule.check(val);
    if (!ok) break;
    maxPassed = i + 1;
  }

  if (maxPassed > currentMaxRule) {
    currentMaxRule = maxPassed;
    if (currentMaxRule >= RULES.length) {
      victory.style.display = "block";
      pwInput.disabled = true;
      hintBtn.disabled = true;
      buyBtn.style.display = "none";
    }
  }

  renderRules(maxPassed);
}

function renderRules(passed) {
  rulesDiv.innerHTML = "";
  for (let i = 0; i < Math.min(passed + 2, RULES.length); i++) { // show next one too
    const rule = RULES[i];
    const ok = i < passed;
    const div = document.createElement("div");
    div.className = "rule-item " + (ok ? "ok" : "fail");
    div.innerHTML = `
      <div class="status">${ok ? "✔" : "✖"}</div>
      <div class="rule-text">${typeof rule.text === "function" ? rule.text() : rule.text}</div>
    `;
    rulesDiv.appendChild(div);
  }
}

pwInput.addEventListener("input", evaluate);
pwInput.addEventListener("paste", () => setTimeout(evaluate, 50));

evaluate(); // initial
updateHintsUI();
</script>
</body>
</html>
