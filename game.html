<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILLA8 | Gate</title>
    <style>
        :root {
            --bg: #FFFCEB;
            --card: #F2E8CF;
            --text: #121212;
            --muted: #A09B8E;
            --accent: #E6CC00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        .level-header {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--muted);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .puzzle-card {
            background: var(--card);
            min-height: 280px;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
            margin-bottom: 40px;
            padding: 30px;
            transition: transform 0.3s ease;
        }

        /* Level Specific Styles */
        .display-text { font-size: 32px; font-weight: 300; letter-spacing: -1px; }
        .upside-down { transform: rotate(180deg); }
        .tap-btn { 
            padding: 15px 30px; 
            border: 1px solid var(--text); 
            border-radius: 10px; 
            cursor: pointer;
            user-select: none;
        }

        input {
            width: 80%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text);
            padding: 10px;
            font-size: 20px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }

        .hint-trigger {
            position: fixed;
            bottom: 30px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            color: var(--muted);
        }

        /* Feedback Anims */
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="level-header" id="lvl-info">WORLD 1 • LEVEL 1</div>
        
        <div class="puzzle-card" id="card">
            <div id="puzzle-content" class="display-text">WELCOME</div>
        </div>

        <div id="input-zone">
            <input type="text" id="answer-box" placeholder="TYPE HERE" spellcheck="false" autocomplete="off">
        </div>

        <div class="hint-trigger" onclick="alert(levels[currentIndex].hint)">NEED A HINT?</div>
    </div>

    <script>
        const levels = [
            { type: "input", display: "WELCOME", answer: "WELCOME", hint: "It's written right there." },
            { type: "tap", display: "<div class='tap-btn' id='tap-target'>TAP ME</div>", answer: "TRIGGER", hint: "Click exactly on the text." },
            { type: "input", display: "12321", answer: "12321", hint: "Symmetry is key." },
            { type: "input", display: "<div class='upside-down'>GENERATE</div>", answer: "GENERATE", hint: "Look at it from another perspective." }
        ];

        let currentIndex = 0;
        const wrapper = document.getElementById('game-wrapper');
        const card = document.getElementById('card');
        const content = document.getElementById('puzzle-content');
        const answerBox = document.getElementById('answer-box');
        const lvlInfo = document.getElementById('lvl-info');

        function initLevel() {
            const data = levels[currentIndex];
            
            // Fade out
            wrapper.style.opacity = "0";
            
            setTimeout(() => {
                lvlInfo.innerText = `WORLD 1 • LEVEL ${currentIndex + 1}`;
                content.innerHTML = data.display;
                answerBox.value = "";
                
                // Show/Hide input
                answerBox.parentElement.style.display = (data.type === "input") ? "block" : "none";
                
                // If it's a tap level, set up the click listener
                if (data.type === "tap") {
                    document.getElementById('tap-target').onclick = () => nextLevel();
                }

                // Fade in
                wrapper.style.opacity = "1";
                if(data.type === "input") answerBox.focus();
            }, 400);
        }

        function nextLevel() {
            currentIndex++;
            if (currentIndex < levels.length) {
                initLevel();
            } else {
                content.innerText = "VILLA8 UNLOCKED";
                answerBox.style.display = "none";
            }
        }

        // Logic: Check answer as user types
        answerBox.addEventListener('input', (e) => {
            const input = e.target.value.toUpperCase();
            const correct = levels[currentIndex].answer.toUpperCase();
            
            if (input === correct) {
                nextLevel();
            }
        });

        // If they press Enter but it's wrong, shake the card
        answerBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && answerBox.value.toUpperCase() !== levels[currentIndex].answer) {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        });

        // Start
        initLevel();
    </script>
</body>
</html>
