<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILLA8 | Advanced Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate: #121212;
            --lemon: #DFFF00;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(223, 255, 0, 0.15);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--slate);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- UI FRAMEWORK --- */
        #villa-ui {
            position: relative;
            width: 100%; max-width: 400px; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        #header {
            position: absolute; top: 60px;
            letter-spacing: 12px; font-weight: 800;
            color: var(--lemon); font-size: 1.2rem;
            text-align: center; width: 100%;
        }

        .level-container {
            width: 100%; height: 400px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            position: relative; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- GESTURE ELEMENTS --- */
        .slider-rail {
            width: 8px; height: 250px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px; position: relative;
        }

        #handle {
            width: 44px; height: 44px;
            background: var(--lemon);
            border-radius: 50%; position: absolute;
            left: -18px; cursor: grab;
            box-shadow: 0 0 20px rgba(223, 255, 0, 0.4);
            touch-action: none;
        }

        /* --- TASK OVERLAYS --- */
        .task-box {
            text-align: center; padding: 20px;
        }

        .input-field {
            background: none; border: none; border-bottom: 2px solid var(--lemon);
            color: var(--lemon); font-size: 2rem; width: 140px;
            text-align: center; outline: none; margin-top: 20px;
            font-family: 'Inter', sans-serif; font-weight: 800;
        }

        #footer-nav {
            position: absolute; bottom: 50px;
            display: flex; gap: 15px;
        }

        .action-btn {
            padding: 12px 24px;
            border: 1px solid var(--lemon);
            color: var(--lemon);
            border-radius: 30px;
            font-size: 10px; font-weight: 800;
            text-decoration: none; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .action-btn:hover { background: var(--lemon); color: var(--slate); }

        .hint-text {
            position: absolute; bottom: 120px;
            font-size: 11px; color: rgba(255,255,255,0.3);
            text-transform: uppercase; letter-spacing: 2px;
        }

        .hidden { display: none !important; opacity: 0; transform: scale(0.9); }
        
        /* Success Animation */
        .success-flash { background: var(--lemon) !important; }
    </style>
</head>
<body>

    <div id="villa-ui">
        <div id="header">VILLA8</div>

        <div id="lvl-1" class="level-container">
            <div class="slider-rail">
                <div id="handle" style="top: 200px;"></div>
            </div>
        </div>

        <div id="lvl-2" class="level-container hidden">
            <div class="task-box">
                <p style="font-size: 12px; letter-spacing: 1px; color: #888;">WORLD KEY REQUIRED</p>
                <p style="font-size: 14px;">Find the code hidden in our<br><b>Official Studio Website</b></p>
                <input type="text" id="web-code" class="input-field" maxlength="4" autocomplete="off">
            </div>
        </div>

        <div id="lvl-3" class="level-container hidden">
            <div class="task-box">
                <p style="font-size: 12px; letter-spacing: 1px; color: #888;">VISUAL SYNC</p>
                <p style="font-size: 14px;">Follow @Villa8_Studio<br>Check <b>Story Highlights</b> for the Key</p>
                <input type="text" id="ig-code" class="input-field" maxlength="4" placeholder="••••">
            </div>
        </div>

        <div class="hint-text" id="status-msg">Zone 01: Calibration</div>

        <div id="footer-nav">
            <a href="https://yourwebsite.com" target="_blank" class="action-btn">Visit Website</a>
            <a href="https://instagram.com/yourprofile" target="_blank" class="action-btn">Hint (IG)</a>
        </div>
    </div>

    <script>
        const state = { currentLevel: 1 };

        // --- HAPTIC FEEDBACK ---
        const haptic = () => { if ("vibrate" in navigator) navigator.vibrate(20); };

        // --- LEVEL 1 ENGINE: PHYSICS SLIDE ---
        const handle = document.getElementById('handle');
        const rail = document.querySelector('.slider-rail');
        let isDragging = false;

        handle.addEventListener('pointerdown', () => { isDragging = true; haptic(); });
        window.addEventListener('pointerup', () => isDragging = false);

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = rail.getBoundingClientRect();
            let pos = e.clientY - rect.top;
            
            if (pos >= 0 && pos <= 206) {
                handle.style.top = pos + 'px';
                // Success Condition: Must be held at the very top (Zone 0)
                if (pos < 5) {
                    isDragging = false;
                    completeLevel(1);
                }
            }
        });

        // --- LEVEL 2 ENGINE: WEB CODE ---
        document.getElementById('web-code').addEventListener('input', (e) => {
            if (e.target.value === "1998") { // Hidden code on your site
                haptic();
                completeLevel(2);
            }
        });

        // --- LEVEL 3 ENGINE: IG CODE ---
        document.getElementById('ig-code').addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === "V8X1") { // Code from IG Highlight
                haptic();
                completeLevel(3);
            }
        });

        // --- LEVEL TRANSITION LOGIC ---
        function completeLevel(lvl) {
            const current = document.getElementById(`lvl-${lvl}`);
            const next = document.getElementById(`lvl-${lvl + 1}`);
            const status = document.getElementById('status-msg');

            current.classList.add('success-flash');
            haptic();

            setTimeout(() => {
                current.classList.add('hidden');
                if (next) {
                    next.classList.remove('hidden');
                    state.currentLevel++;
                    updateStatus();
                } else {
                    status.innerText = "ALL ZONES CALIBRATED";
                }
            }, 800);
        }

        function updateStatus() {
            const msgs = ["", "Zone 01: Calibration", "Zone 02: External Fetch", "Zone 03: Social Sync"];
            document.getElementById('status-msg').innerText = msgs[state.currentLevel];
        }
    </script>
</body>
</html>
