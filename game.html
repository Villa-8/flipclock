<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Villa8 | System Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --spotify-yellow: #FDFD96;
            --spotify-dark: #121212;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--spotify-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 253, 150, 0.1);
            border-radius: 24px;
        }
        .yellow-glow {
            box-shadow: 0 0 20px rgba(253, 253, 150, 0.3);
        }
        /* Portrait vs Landscape logic */
        @media (orientation: portrait) {
            .game-container { width: 90vw; height: 70vh; }
        }
        @media (orientation: landscape) {
            .game-container { width: 60vw; height: 80vh; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <header class="fixed top-0 w-full p-6 flex justify-between items-center z-50">
        <h1 class="text-2xl font-bold tracking-tighter" style="color: var(--spotify-yellow)">VILLA8</h1>
        <div class="flex gap-4">
            <button onclick="showHint()" class="px-4 py-2 glass-card text-xs uppercase tracking-widest hover:bg-yellow-100 hover:text-black transition">Hint</button>
            <div id="level-display" class="px-4 py-2 border border-white/20 rounded-full text-xs">LVL 01</div>
        </div>
    </header>

    <main id="game-stage" class="game-container glass-card flex items-center justify-center relative overflow-hidden">
        <div id="puzzle-content" class="w-full h-full flex flex-col items-center justify-center p-8 text-center">
            <h2 id="task-title" class="text-3xl font-light mb-8">System Booting...</h2>
            <div id="interactive-element" class="relative">
                </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full p-6 flex justify-center gap-8 bg-gradient-to-t from-black to-transparent">
        <a href="https://instagram.com/villa8" target="_blank" class="opacity-50 hover:opacity-100 transition"><i class="fab fa-instagram text-xl"></i></a>
        <a href="https://villa8.com" target="_blank" class="opacity-50 hover:opacity-100 transition"><i class="fas fa-globe text-xl"></i></a>
    </footer>

    <div id="hint-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6">
        <div class="glass-card p-8 max-w-sm w-full text-center">
            <h3 class="text-xl mb-4" style="color: var(--spotify-yellow)">Data Access Required</h3>
            <p class="text-sm text-gray-400 mb-6">To unlock the master hint for this level, visit our secure terminal.</p>
            <button onclick="visitSiteForHint()" class="w-full py-3 bg-[#FDFD96] text-black font-bold rounded-full mb-4">VISIT WEBSITE</button>
            <button onclick="closeHint()" class="text-xs uppercase tracking-widest opacity-50">Close</button>
        </div>
    </div>

    <script>
        // Game State Logic
        let currentLevel = 1;
        
        const levels = {
            1: {
                title: "Calibration",
                hint: "Find the center of the frequency.",
                action: () => renderLevel1()
            }
            // Add more levels here...
        };

        function renderLevel1() {
            const stage = document.getElementById('interactive-element');
            stage.innerHTML = `
                <div id='ring' class='w-32 h-32 border-4 border-[#FDFD96] rounded-full animate-pulse flex items-center justify-center cursor-pointer'>
                    <div class='w-4 h-4 bg-white rounded-full'></div>
                </div>
            `;
            document.getElementById('task-title').innerText = levels[1].title;
            
            document.getElementById('ring').onclick = () => {
                alert("System Calibrated. Moving to Level 2...");
                // Progress logic here
            };
        }

        function showHint() {
            document.getElementById('hint-modal').classList.remove('hidden');
        }

        function closeHint() {
            document.getElementById('hint-modal').classList.add('hidden');
        }

        function visitSiteForHint() {
            window.open('https://villa8.com', '_blank');
            // Log logic to unlock hint after return
        }

        // Initialize
        renderLevel1();
    </script>
</body>
</html>
