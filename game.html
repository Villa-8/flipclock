<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Villa8 Flow - Modern Puzzle Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #ffeb3b;
            --accent-dark: #ffc107;
            --bg-dark: #0a0a0a;
            --bg-mid: #121212;
            --bg-light: #1a1a1a;
            --text: #ffffff;
            --glass: rgba(26, 26, 26, 0.92);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 50%, var(--bg-light) 100%);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation; /* better mobile feel */
        }

        #container {
            position: relative;
            width: 100dvw;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        #topbar {
            position: absolute;
            top: max(12px, 2dvh);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 20px);
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: clamp(10px, 2.5vw, 14px) clamp(16px, 4vw, 24px);
            border-radius: 999px;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 32px rgba(255, 235, 59, 0.25);
            pointer-events: auto;
            font-size: clamp(14px, 3.5vw, 17px);
            white-space: nowrap;
        }

        #hints {
            background: rgba(255, 235, 59, 0.18);
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--accent);
        }

        #sidebar {
            position: fixed;
            inset: 0;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            padding: env(safe-area-inset-top) 16px  env(safe-area-inset-bottom) 16px;
            overflow-y: auto;
            pointer-events: none;
            z-index: 30;
        }

        #sidebar.open {
            transform: translateY(0);
            pointer-events: auto;
        }

        @media (min-width: 700px) {
            #sidebar {
                position: absolute;
                left: -360px;
                top: 0;
                width: 360px;
                height: 100dvh;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                border-right: 1px solid rgba(255,235,59,0.15);
            }
            #sidebar.open {
                transform: translateX(0);
            }
        }

        .world {
            margin: 16px 0;
            padding: 20px;
            background: rgba(255, 235, 59, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 235, 59, 0.25);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .world:hover, .world:active {
            background: rgba(255, 235, 59, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 235, 59, 0.3);
        }

        .level-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .level {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: clamp(13px, 3.2vw, 15px);
            transition: all 0.2s;
        }

        .level.unlocked { background: rgba(255,235,59,0.25); border-color: var(--accent); }
        .level.completed { background: var(--accent); color: #000; }

        #bottombar {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: clamp(16px, 5vw, 24px);
            pointer-events: auto;
            z-index: 15;
        }

        button {
            width: clamp(56px, 14vw, 72px);
            height: clamp(56px, 14vw, 72px);
            border: none;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            color: #000;
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(255, 235, 59, 0.4);
            transition: all 0.18s ease;
        }

        button:active {
            transform: scale(0.92);
            box-shadow: 0 4px 16px rgba(255, 235, 59, 0.6);
        }

        button:disabled {
            opacity: 0.45;
            transform: none;
            box-shadow: none;
        }

        #modal .modal-content {
            max-width: min(92vw, 420px);
            padding: clamp(24px, 6vw, 36px);
            border-radius: 24px;
        }

        #complete-screen {
            max-width: min(90vw, 380px);
            padding: clamp(24px, 6vw, 40px);
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #topbar { top: 8px; padding: 8px 16px; font-size: 14px; }
            #bottombar { bottom: 8px; }
        }
    </style>
</head>
<body>

<!-- Rest of your HTML stays the same -->

<script>
    // Add / update these parts in your <script>

    function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        // Make grid fill screen better on all devices
        const availW = rect.width  - 40; // safe padding
        const availH = rect.height - 140; // reserve space for bars

        const cellSize = Math.min(
            availW / game.w,
            availH / game.h
        );

        game.cellW = game.cellH = cellSize;
        game.offsetX = (rect.width  - game.w * cellSize) / 2;
        game.offsetY = (rect.height - game.h * cellSize) / 2 + 20; // slight top bias
    }

    // Better mobile sidebar toggle
    document.getElementById('menu').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
    };

    // Close sidebar when clicking outside (mobile friendly)
    document.getElementById('sidebar').onclick = (e) => {
        if (e.target === document.getElementById('sidebar')) {
            document.getElementById('sidebar').classList.remove('open');
        }
    };

    // Optional: close sidebar on level select (already there, but ensure)
    function selectLevel(world, level) {
        if (world > game.maxWorld) return;
        game.currentWorld = world;
        game.currentLevel = level;
        loadLevel();
        document.getElementById('sidebar').classList.remove('open');
    }

    // Add passive touch listeners if needed (already have pointer events)

    // Call resize on orientation change too
    window.addEventListener('orientationchange', resize);
    window.addEventListener('resize', resize);

    // Initial call
    resize();
    loadLevel();
    requestAnimationFrame(loop);
</script>

</body>
</html>
