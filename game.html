<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILLA8 | Minimalist Puzzle</title>
    <style>
        :root {
            --slate: #121212;
            --lemon: #DFFF00;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f0f0f0;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--slate);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* The Header */
        #header {
            position: absolute; top: 40px; width: 100%;
            text-align: center; letter-spacing: 8px;
            font-weight: 800; color: var(--lemon); opacity: 0.8;
        }

        /* The Game Container */
        #game-container {
            width: 320px; height: 480px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }

        /* Puzzle Elements */
        .slider-rail {
            width: 10px; height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px; position: relative;
        }

        #slider-handle {
            width: 30px; height: 30px;
            background: var(--lemon);
            border-radius: 50%; position: absolute;
            left: -10px; cursor: pointer;
            box-shadow: 0 0 15px var(--lemon);
        }

        /* Hint/Task Section */
        #ui-footer {
            position: absolute; bottom: 40px;
            display: flex; gap: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--lemon);
            color: var(--lemon);
            border-radius: 20px;
            font-size: 12px; cursor: pointer;
            text-decoration: none; transition: 0.3s;
        }

        .btn:hover { background: var(--lemon); color: var(--slate); }

        /* Hidden Level State */
        .hidden { display: none; }
        
        #message { margin-top: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div id="header">VILLA8</div>

    <div id="game-container">
        <div id="level-1" class="level">
            <div class="slider-rail">
                <div id="slider-handle" style="top: 170px;"></div>
            </div>
        </div>

        <div id="level-2" class="level hidden">
            <p style="text-align:center; padding: 20px;">ZONE LOCKED.<br>Find the code on our site.</p>
            <input type="text" id="passcode" placeholder="ENTER CODE" 
                   style="background:none; border:1px solid var(--lemon); color:white; text-align:center; padding:10px;">
        </div>
    </div>

    <div id="message">Level 01: Balance the Frequency</div>

    <div id="ui-footer">
        <a href="https://yourwebsite.com" target="_blank" class="btn">VISIT SITE</a>
        <a href="https://instagram.com/yourprofile" target="_blank" class="btn">HINT (IG)</a>
    </div>

    <script>
        const handle = document.getElementById('slider-handle');
        const level1 = document.getElementById('level-1');
        const level2 = document.getElementById('level-2');
        const msg = document.getElementById('message');

        // --- LEVEL 1 LOGIC: THE SLIDER ---
        let isDragging = false;

        handle.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let containerRect = document.querySelector('.slider-rail').getBoundingClientRect();
            let newTop = e.clientY - containerRect.top - 15;
            
            if (newTop >= 0 && newTop <= 170) {
                handle.style.top = newTop + 'px';
                
                // Winning Condition (Exact Spot)
                if (Math.abs(newTop - 50) < 5) {
                    completeLevel1();
                }
            }
        });

        function completeLevel1() {
            msg.innerText = "ACCESS GRANTED";
            handle.style.background = "#fff";
            setTimeout(() => {
                level1.classList.add('hidden');
                level2.classList.remove('hidden');
                msg.innerText = "Task: Find code at Villa8.com";
            }, 1000);
        }

        // --- LEVEL 2 LOGIC: THE WEBSITE CODE ---
        document.getElementById('passcode').addEventListener('input', (e) => {
            if (e.target.value === "8888") { // Example code hidden on your site
                alert("World 2 Unlocked");
                // Progress to Level 3...
            }
        });
    </script>
</body>
</html>
