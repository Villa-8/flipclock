<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILLA8 | Think. Observe. Decode.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFCEB;
            --card: #F2E8CF;
            --text: #121212;
            --accent: #E6CC00;
            --muted: #757575;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- UI Components --- */
        #game-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition);
        }

        .level-indicator {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--muted);
        }

        .puzzle-card {
            background: var(--card);
            padding: 60px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            background: transparent;
            border-bottom: 2px solid var(--text);
            font-family: inherit;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-top: 20px;
        }

        .btn-hint {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* --- Animations --- */
        .active { opacity: 1 !important; transform: translateY(0) !important; }
        
        .shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Special Level Styles */
        .upside-down { transform: rotate(180deg); }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="level-indicator" id="level-label">WORLD 1 • LEVEL 1</div>
        
        <div class="puzzle-card" id="puzzle-box">
            </div>

        <div id="input-area">
            <input type="text" id="answer-input" placeholder="ENTER GATE" autocomplete="off">
        </div>
    </div>

    <button class="btn-hint" onclick="showHint()">HINT 🔒</button>

    <script>
        // --- LEVEL DATA ---
        const levels = [
            { id: 1, type: "input", display: "WELCOME", answer: "WELCOME", hint: "The answer is literally looking at you." },
            { id: 2, type: "tap", display: "<span id='tap-target' style='border:1px solid #121212; padding:10px;'>TAP ME</span>", answer: "TAP", hint: "Tap the text, not the box." },
            { id: 3, type: "input", display: "12321", answer: "12321", hint: "It reads the same forward and backward." },
            { id: 4, type: "input", display: "<span class='upside-down'>generate</span>", answer: "generate", hint: "Turn your world around." }
        ];

        let currentLevelIndex = localStorage.getItem('v8_level') || 0;
        const container = document.getElementById('game-container');
        const puzzleBox = document.getElementById('puzzle-box');
        const inputField = document.getElementById('answer-input');
        const levelLabel = document.getElementById('level-label');

        // --- CORE ENGINE ---
        function loadLevel() {
            const lvl = levels[currentLevelIndex];
            container.classList.remove('active');
            
            setTimeout(() => {
                levelLabel.innerText = `WORLD 1 • LEVEL ${lvl.id}`;
                puzzleBox.innerHTML = lvl.display;
                inputField.value = "";
                
                // Show/Hide input based on type
                inputField.style.display = (lvl.type === "input") ? "block" : "none";
                
                // Specialized Logic for Tapping Levels
                if(lvl.id === 2) {
                    document.getElementById('tap-target').onclick = () => nextLevel();
                }

                container.classList.add('active');
            }, 500);
        }

        function checkAnswer() {
            const lvl = levels[currentLevelIndex];
            const val = inputField.value.trim().toUpperCase();
            
            if (val === lvl.answer.toUpperCase()) {
                nextLevel();
            } else if (val !== "") {
                puzzleBox.classList.add('shake');
                setTimeout(() => puzzleBox.classList.remove('shake'), 400);
            }
        }

        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex < levels.length) {
                localStorage.setItem('v8_level', currentLevelIndex);
                loadLevel();
            } else {
                puzzleBox.innerHTML = "YOU'VE ENTERED VILLA8 CORE.";
                inputField.style.display = "none";
            }
        }

        function showHint() {
            alert(levels[currentLevelIndex].hint);
            // This is where you'd trigger the AdMob/Rewarded Ad logic
        }

        // Listen for "Enter" key
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        // Initialize
        window.onload = loadLevel;
    </script>
</body>
</html>
