<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILLA8 | Gate</title>
    <style>
        :root { --bg: #FFFCEB; --card: #F2E8CF; --text: #121212; --muted: #A09B8E; --accent: #E6CC00; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        #app { width: 100%; max-width: 420px; padding: 30px; text-align: center; transition: opacity 0.4s ease; }
        .header { font-size: 11px; font-weight: 900; letter-spacing: 4px; color: var(--muted); margin-bottom: 30px; text-transform: uppercase; }
        .card { background: var(--card); min-height: 320px; border-radius: 45px; display: flex; align-items: center; justify-content: center; box-shadow: 0 25px 50px rgba(0,0,0,0.05); margin-bottom: 40px; padding: 40px; transition: transform 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67); user-select: none; position: relative; }
        .display { font-size: 28px; font-weight: 300; line-height: 1.4; pointer-events: none; white-space: pre-wrap; }
        input { width: 90%; background: transparent; border: none; border-bottom: 2px solid var(--text); padding: 12px; font-size: 24px; text-align: center; outline: none; text-transform: uppercase; letter-spacing: 3px; }
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.05); }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; }
        .hint-bar { position: fixed; bottom: 40px; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; text-decoration: underline; }
        #modal { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .reward-btn { width: 100%; padding: 20px; background: var(--text); color: var(--bg); margin: 10px 0; border-radius: 15px; text-decoration: none; font-weight: bold; text-align: center; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .upside-down { transform: rotate(180deg); display: inline-block; }
    </style>
</head>
<body>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div id="app">
        <div class="header" id="lvl-tag">WORLD 1 • LEVEL 1</div>
        <div class="card" id="main-card"><div id="content" class="display">WELCOME</div></div>
        <div id="input-wrap"><input type="text" id="entry" placeholder="ENTER" autocomplete="off" spellcheck="false"></div>
        <div class="hint-bar" onclick="handleHint()">HINTS REMAINING: <span id="hint-count">5</span></div>
    </div>
    <div id="modal">
        <h1 style="margin-bottom: 10px;">OUT OF HINTS</h1>
        <p style="margin-bottom: 30px; color: var(--muted);">Unlock more logic gates below.</p>
        <a href="https://villa8.com" target="_blank" class="reward-btn" onclick="reward(2)">VISIT WEBSITE (+2)</a>
        <a href="https://youtube.com" target="_blank" class="reward-btn" onclick="reward(1)">WATCH VIDEO (+1)</a>
        <a href="https://instagram.com" target="_blank" class="reward-btn" onclick="reward(1)">FOLLOW IG (+1)</a>
        <p onclick="closeModal()" style="margin-top: 20px; cursor: pointer; font-weight: bold; color: var(--muted);">CLOSE</p>
    </div>

    <script>
        const levels = [
            // WORLD 1: OBSERVE
            { d: "WELCOME", a: "WELCOME", h: "It's on the screen." },
            { d: "TAP ME", a: "_TAP", h: "Click the card." },
            { d: "12321", a: "12321", h: "Palindrome." },
            { d: "4, 5, 6, ?", a: "7", h: "Next number." },
            { d: "HOLD SECRETS", a: "_HOLD", h: "Hold for 3 seconds." },
            { d: "WHITE", a: "BLACK", h: "The opposite." },
            { d: "3 + 3 x 3", a: "12", h: "Multiply first (3x3=9), then add 3." },
            { d: "•••••", a: "5", h: "Count the dots." },
            { d: "<div class='upside-down'>UP</div>", a: "DOWN", h: "Flip it and find the opposite." },
            { d: "SWIPE LEFT", a: "_SWIPE_LEFT", h: "Thumb slide left." },
            
            // WORLD 2: DECODE
            { d: "V I L L A 8", a: "VILLA8", h: "No spaces." },
            { d: "M, T, W, T, ?", a: "F", h: "Monday, Tuesday..." },
            { d: "1, 2, 4, 8, ?", a: "16", h: "Double it." },
            { d: "RED + YELLOW", a: "ORANGE", h: "Mix the colors." },
            { d: "SILENCE", a: "_WAIT", h: "Don't touch anything for 5s." },
            { d: "08:00 PM", a: "20:00", h: "Military time." },
            { d: "A=1, B=2, C=?", a: "3", h: "Alphabet order." },
            { d: "O, T, T, F, F, S, ?", a: "S", h: "One, Two, Three, Four, Five, Six..." },
            { d: "dlrow olleh", a: "hello world", h: "Backwards." },
            { d: "COUNTDOWN\n3, 2, 1, ?", a: "0", h: "Blast off." },

            // WORLD 3: LOGIC LOOP
            { d: "BLUE (Written in Red)", a: "RED", h: "Ignore the word, what color is it?" },
            { d: "111=3, 222=6, 333=?", a: "9", h: "Sum of digits." },
            { d: "SHAKE ME", a: "_TAP", h: "I'm a static site, so just TAP for now." },
            { d: "THE ANSWER IS 8", a: "8", h: "Don't overthink." },
            { d: "√64", a: "8", h: "Square root." },
            { d: "0, 1, 1, 2, 3, 5, ?", a: "8", h: "Fibonacci sequence." },
            { d: "LEVEL 27", a: "27", h: "Check the top of the screen." },
            { d: "CLICK HINT", a: "_TAP", h: "You just did. Tap to win." },
            { d: "E-N-T-E-R", a: "ENTER", h: "Spell it out." },
            { d: "10 * 10", a: "100", h: "Basic math." },

            // WORLD 4: HIDDEN SYSTEMS
            { d: "G-A-T-E", a: "71205", h: "G=7, A=1, T=20, E=5." },
            { d: "404", a: "NOT FOUND", h: "Web error code." },
            { d: "AM I A ROBOT?", a: "NO", h: "Human answer." },
            { d: "S, M, H, D, W, ?", a: "MONTH", h: "Seconds, Minutes, Hours, Days, Weeks..." },
            { d: "FF0000", a: "RED", h: "Hex color for red." },
            { d: "01000001", a: "A", h: "Binary code for A." },
            { d: "VILLA8.COM", a: "WEBSITE", h: "What is this?" },
            { d: "THE GATE", a: "OPEN", h: "What do you do with a gate?" },
            { d: "PI", a: "3.14", h: "First three digits." },
            { d: "INVISIBLE", a: "VILLA8", h: "Highlight the text if you can't see it." },

            // WORLD 5: VILLA8 CORE
            { d: "42", a: "LIFE", h: "Hitchhiker's Guide to the Galaxy." },
            { d: "1=5, 2=25, 5=?", a: "1", h: "Read the first part again." },
            { d: "MIRROR", a: "RORRIM", h: "Reflection." },
            { d: "THE LAST KEY", a: "Z", h: "End of the alphabet." },
            { d: "V x 8", a: "VVVVVVVV", h: "V eight times." },
            { d: "1, 3, 6, 10, ?", a: "15", h: "Add 2, then 3, then 4, then 5." },
            { d: "NO HINTS", a: "CORE", h: "The code is CORE." },
            { d: "WAIT... NOW", a: "_WAIT", h: "Patience." },
            { d: "ALMOST", a: "THERE", h: "Common phrase." },
            { d: "YOU ARE READY", a: "READY", h: "The final door." }
        ];

        let cur = parseInt(localStorage.getItem('v8_prog')) || 0;
        let hints = parseInt(localStorage.getItem('v8_hints')) || 5;
        let timer;
        const app = document.getElementById('app'), card = document.getElementById('main-card'), content = document.getElementById('content'), entry = document.getElementById('entry'), tag = document.getElementById('lvl-tag'), pBar = document.getElementById('progress-bar'), hDisplay = document.getElementById('hint-count');

        function load() {
            if (cur >= levels.length) { finishGame(); return; }
            const l = levels[cur];
            app.style.opacity = "0";
            setTimeout(() => {
                tag.innerText = `WORLD ${Math.floor(cur/10)+1} • LEVEL ${cur+1}`;
                content.innerHTML = l.d; entry.value = ""; hDisplay.innerText = hints;
                pBar.style.width = `${(cur/levels.length)*100}%`;
                entry.style.display = l.a.startsWith("_") ? "none" : "inline-block";
                setupSpecial(l.a);
                app.style.opacity = "1";
                if(entry.style.display !== "none") entry.focus();
            }, 300);
        }

        function setupSpecial(a) {
            card.onclick = card.onmousedown = card.ontouchstart = null;
            if (timer) clearTimeout(timer);
            if (a === "_TAP") card.onclick = win;
            else if (a === "_HOLD") {
                card.onmousedown = card.ontouchstart = () => { timer = setTimeout(win, 3000); card.style.transform = "scale(0.95)"; };
                card.onmouseup = card.ontouchend = () => { clearTimeout(timer); card.style.transform = "scale(1)"; };
            } else if (a === "_WAIT") timer = setTimeout(win, 5000);
            else if (a === "_SWIPE_LEFT") {
                let s = 0; card.ontouchstart = (e) => s = e.touches[0].clientX;
                card.ontouchend = (e) => { if (e.changedTouches[0].clientX < s - 80) win(); };
            }
        }

        function win() { cur++; localStorage.setItem('v8_prog', cur); load(); }
        function handleHint() { 
            if (hints > 0) { hints--; localStorage.setItem('v8_hints', hints); hDisplay.innerText = hints; alert("HINT: " + levels[cur].h); } 
            else document.getElementById('modal').style.display = 'flex'; 
        }
        function reward(q) { hints += q; localStorage.setItem('v8_hints', hints); hDisplay.innerText = hints; closeModal(); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function finishGame() { tag.innerText = "GATE OPEN"; content.innerText = "WELCOME TO VILLA8 CORE"; entry.style.display = "none"; }
        entry.addEventListener('input', (e) => { if (e.target.value.toUpperCase() === levels[cur].a.toUpperCase()) win(); });
        load();
    </script>
</body>
</html>
