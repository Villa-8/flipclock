<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Scion</title>
    <style>
        body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Comic Sans MS', sans-serif; }
        #scion-container { cursor: pointer; position: relative; }
        #scion-img { width: 300px; transition: transform 0.1s; }
        #scion-img:active { transform: scale(0.95); }
        .bubble { background: white; padding: 15px; border-radius: 20px; border: 3px solid #333; margin-bottom: 20px; font-weight: bold; min-height: 20px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; background: #4CAF50; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="bubble" id="status-bubble">Click "Record" and talk to Scion!</div>

    <div id="scion-container" onclick="pokeScion()">
        <img id="scion-img" src="scion_closed.png" alt="Scion">
    </div>

    <button onclick="startListening()">🎤 Record (Talk to Scion)</button>

    <script>
        const scionImg = document.getElementById('scion-img');
        const statusBubble = document.getElementById('status-bubble');

        // 1. SCION REPEATS WHAT YOU SAY
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';

            statusBubble.innerText = "Scion is listening...";
            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                statusBubble.innerText = `You said: "${transcript}"`;
                scionTalk(transcript);
            };
        }

        // 2. SCION TALKING LOGIC
        function scionTalk(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Make Scion sound funny (high pitch)
            utterance.pitch = 2.0; 
            utterance.rate = 1.2;

            // Mouth Animation
            utterance.onstart = () => {
                const interval = setInterval(() => {
                    // Toggle mouth open/closed every 150ms
                    scionImg.src = scionImg.src.includes('closed') ? 'scion_open.png' : 'scion_closed.png';
                }, 150);

                utterance.onend = () => {
                    clearInterval(interval);
                    scionImg.src = 'scion_closed.png'; // Reset to closed
                    statusBubble.innerText = "Done! Tell me something else.";
                };
            };

            window.speechSynthesis.speak(utterance);
        }

        // 3. POKE SCION
        function pokeScion() {
            scionTalk("Hey! Stop poking me!");
        }
    </script>
</body>
</html>
