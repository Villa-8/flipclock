<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thirsty Scion</title>
    <style>
        body { margin: 0; padding: 0; background: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: white; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        button { padding: 10px 20px; cursor: pointer; background: #e67e22; border: none; color: white; border-radius: 5px; font-size: 16px; }
        button:hover { background: #d35400; }
        #instructions { margin-top: 10px; font-size: 14px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Thirsty Scion: Lvl <span id="level-num">1</span></h1>
        <button onclick="releaseWater()">Release Water (Space)</button>
        <button onclick="nextLevel()">Next Level</button>
        <div id="instructions">Click & Drag to draw lines!</div>
    </div>
    <div id="game-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script>
        // --- ENGINE SETUP ---
        const { Engine, Render, Runner, World, Bodies, Composite } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = 1;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#34495e'
            }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);

        // --- LEVEL DATA ---
        // To add 20 levels, follow the structure below for each level.
        const levels = [
            // Level 1: Simple drop
            { pipe: { x: 100, y: 100 }, scion: { x: window.innerWidth - 100, y: window.innerHeight - 100 }, obstacles: [] },
            // Level 2: Wall obstacle
            { pipe: { x: 100, y: 100 }, scion: { x: window.innerWidth - 100, y: window.innerHeight - 100 }, obstacles: [{x: window.innerWidth/2, y: window.innerHeight/2, w: 20, h: 300}] },
            // Level 3: Funnel challenge
            { pipe: { x: window.innerWidth/2, y: 50 }, scion: { x: window.innerWidth/2, y: window.innerHeight - 100 }, obstacles: [{x: window.innerWidth/2 - 100, y: window.innerHeight/2, w: 20, h: 400}, {x: window.innerWidth/2 + 100, y: window.innerHeight/2, w: 20, h: 400}] }
        ];

        let currentLevel = 0;
        let scionBody;
        let pipeBody;
        let drawnBodies = [];

        // --- LOAD LEVEL ---
        function loadLevel(levelIdx) {
            // Clear previous level elements
            Composite.clear(world, false);
            
            // Scion Body
            scionBody = Bodies.rectangle(levels[levelIdx].scion.x, levels[levelIdx].scion.y, 80, 80, { 
                isStatic: true, 
                render: { fillStyle: '#f1c40f' } // Yellow Scion
            });
            
            // Pipe Body
            pipeBody = Bodies.rectangle(levels[levelIdx].pipe.x, levels[levelIdx].pipe.y, 60, 60, { 
                isStatic: true, 
                render: { fillStyle: '#7f8c8d' } 
            });
            
            World.add(world, [scionBody, pipeBody]);

            // Add Obstacles
            levels[levelIdx].obstacles.forEach(obs => {
                World.add(world, Bodies.rectangle(obs.x, obs.y, obs.w, obs.h, { 
                    isStatic: true, 
                    render: { fillStyle: '#c0392b' } 
                }));
            });

            document.getElementById('level-num').innerText = levelIdx + 1;
        }

        // --- DRAWING MECHANIC ---
        let isDrawing = false;
        let lastX, lastY;

        window.addEventListener('mousedown', (e) => { isDrawing = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                // Create small circles to act as a line
                const dot = Bodies.circle(e.clientX, e.clientY, 8, { 
                    isStatic: true, 
                    render: { fillStyle: '#3498db' } 
                });
                World.add(world, dot);
                drawnBodies.push(dot);
            }
        });

        // --- WATER MECHANIC ---
        function releaseWater() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const drop = Bodies.circle(levels[currentLevel].pipe.x, levels[currentLevel].pipe.y, 5, {
                        restitution: 0.5,
                        friction: 0.01,
                        render: { fillStyle: '#2980b9' }
                    });
                    World.add(world, drop);
                }, i * 30);
            }
        }

        // Spacebar to release water
        window.addEventListener('keydown', (e) => { if(e.code === "Space") releaseWater(); });

        function nextLevel() {
            currentLevel = (currentLevel + 1) % levels.length;
            loadLevel(currentLevel);
        }

        // Start Game
        loadLevel(currentLevel);
    </script>
</body>
</html>
