<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Scion: The Hydration Quest</title>
    <style>
        :root { --primary: #3498db; --accent: #f1c40f; --bg: #2c3e50; }
        body { margin: 0; padding: 0; background: var(--bg); font-family: 'Comic Sans MS', cursive; overflow: hidden; }
        
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; border: 2px solid white;
            color: white; pointer-events: none;
        }

        .controls { pointer-events: auto; margin-top: 15px; }
        button {
            background: var(--accent); border: none; padding: 10px 20px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            transition: transform 0.2s; box-shadow: 0 4px 0 #d4ac0d;
        }
        button:hover { transform: scale(1.1); }
        button:active { transform: translateY(4px); box-shadow: none; }

        #win-screen {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 1000;
            background: white; padding: 40px; border-radius: 30px;
            text-align: center; color: #333; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1 style="margin:0">💧 Thirsty Scion</h1>
        <p>Level: <span id="lvl-display">1</span> / 20</p>
        <div id="progress-bar" style="width:200px; height:20px; background:#444; border-radius:10px; overflow:hidden">
            <div id="fill" style="width:0%; height:100%; background:var(--primary); transition:0.3s"></div>
        </div>
        <div class="controls">
            <button onclick="releaseWater()">RELASE WATER!</button>
            <button onclick="resetDrawing()" style="background:#e74c3c; box-shadow: 0 4px 0 #c0392b;">RESET LINES</button>
        </div>
    </div>

    <div id="win-screen">
        <h2 id="win-text">SCION IS HYDRATED!</h2>
        <button onclick="nextLevel()">GO TO NEXT LEVEL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script>
        const { Engine, Render, Runner, World, Bodies, Events, Composite } = Matter;

        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#85C1E9'
            }
        });

        // --- LEVEL ARCHITECTURE ---
        const levels = [];
        for(let i=0; i<20; i++) {
            levels.push({
                pipe: { x: 100 + (Math.random()*200), y: 100 },
                scion: { x: window.innerWidth - 150, y: window.innerHeight - 150 },
                obs: [
                    { x: window.innerWidth/2, y: 200 + (i * 20), w: 300, h: 20, angle: Math.PI / (i+2) }
                ]
            });
        }

        let currentLevel = 0;
        let collectedWater = 0;
        let isLevelComplete = false;

        function initLevel(idx) {
            isLevelComplete = false;
            collectedWater = 0;
            updateUI();
            World.clear(engine.world);
            
            // Scion (Goal)
            const scion = Bodies.rectangle(levels[idx].scion.x, levels[idx].scion.y, 120, 120, {
                isStatic: true,
                isSensor: true, // Water passes through him but detects it
                label: 'scion',
                render: { 
                    sprite: { texture: 'https://cdn-icons-png.flaticon.com/512/4140/4140037.png', xScale: 0.2, yScale: 0.2 } 
                }
            });

            // Pipe (Source)
            const pipe = Bodies.rectangle(levels[idx].pipe.x, levels[idx].pipe.y, 80, 40, {
                isStatic: true,
                render: { fillStyle: '#34495e' }
            });

            // Obstacles
            const obstacles = levels[idx].obs.map(o => {
                return Bodies.rectangle(o.x, o.y, o.w, o.h, { 
                    isStatic: true, 
                    angle: o.angle,
                    render: { fillStyle: '#A04000', chamfer: { radius: 10 } } 
                });
            });

            World.add(engine.world, [scion, pipe, ...obstacles]);
        }

        // --- INTERACTION: DRAWING ---
        let drawingMode = false;
        window.onmousedown = () => drawingMode = true;
        window.onmouseup = () => drawingMode = false;
        window.onmousemove = (e) => {
            if(drawingMode && !isLevelComplete) {
                const linePart = Bodies.circle(e.clientX, e.clientY, 7, {
                    isStatic: true,
                    label: 'line',
                    render: { fillStyle: '#FFF' }
                });
                World.add(engine.world, linePart);
            }
        }

        // --- ACTION: WATER ---
        function releaseWater() {
            if(isLevelComplete) return;
            for(let i=0; i<40; i++) {
                setTimeout(() => {
                    const drop = Bodies.circle(levels[currentLevel].pipe.x, levels[currentLevel].pipe.y, 5, {
                        restitution: 0.5,
                        label: 'water',
                        render: { fillStyle: '#3498db' }
                    });
                    World.add(engine.world, drop);
                }, i * 50);
            }
        }

        // --- WIN LOGIC ---
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if(pair.bodyA.label === 'scion' && pair.bodyB.label === 'water') {
                    collectedWater++;
                    Composite.remove(engine.world, pair.bodyB);
                    updateUI();
                }
            });
        });

        function updateUI() {
            const fill = document.getElementById('fill');
            const percent = (collectedWater / 15) * 100;
            fill.style.width = Math.min(percent, 100) + '%';
            document.getElementById('lvl-display').innerText = currentLevel + 1;

            if(collectedWater >= 15 && !isLevelComplete) {
                isLevelComplete = true;
                document.getElementById('win-screen').style.display = 'block';
            }
        }

        function resetDrawing() {
            const allBodies = Composite.allBodies(engine.world);
            allBodies.forEach(b => { if(b.label === 'line' || b.label === 'water') Composite.remove(engine.world, b); });
            collectedWater = 0;
            updateUI();
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('win-screen').style.display = 'none';
            initLevel(currentLevel);
        }

        Render.run(render);
        Runner.run(Runner.create(), engine);
        initLevel(0);
    </script>
</body>
</html>
