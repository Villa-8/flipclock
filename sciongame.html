<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thirsty Scion</title>
    <style>
        body { margin: 0; padding: 0; background: #2c3e50; font-family: 'Comic Sans MS', cursive; overflow: hidden; }
        
        /* Proportional Top Right UI */
        #ui-top-right {
            position: absolute; top: 2vh; right: 2vw; z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5vh 1.5vw; border-radius: 15px;
            border: 4px solid #3498db;
            text-align: center;
            box-shadow: 0 6px 0 #2980b9;
        }

        #btn-water {
            background: #e67e22; border: none; padding: 10px 20px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            color: white; font-size: 16px;
            transition: transform 0.1s;
        }
        #btn-water:hover { transform: scale(1.05); }
        #btn-water:active { transform: scale(0.95); }

        #lvl-display { font-weight: bold; color: #2c3e50; font-size: 18px; margin-bottom: 10px; }
        
        /* Canvas fix */
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui-top-right">
        <div id="lvl-display">Level 1</div>
        <button id="btn-water" onclick="releaseWater()">💧 RELEASE WATER</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script>
        const { Engine, Render, Runner, World, Bodies, Events, Composite } = Matter;

        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#85C1E9' // Attractive Sky Blue
            }
        });

        // --- CARTOON ASSETS ---
        // REPLACE THESE URLS WITH YOUR OWN IMAGES FOR BEST RESULTS
        const SPRITES = {
            normal: 'https://cdn-icons-png.flaticon.com/512/4140/4140037.png',
            happy: 'https://cdn-icons-png.flaticon.com/512/4140/4140058.png',
            crying: 'https://cdn-icons-png.flaticon.com/512/4140/4140061.png'
        };

        // --- LEVEL DATA ---
        const levels = [];
        for(let i=0; i<20; i++) {
            levels.push({
                pipe: { x: 100 + (Math.random()*100), y: 100 },
                scion: { x: window.innerWidth - 150, y: window.innerHeight - 150 },
                obs: [
                    { x: window.innerWidth/2, y: 300 + (i * 10), w: 200, h: 20, angle: Math.PI / (i+3) }
                ]
            });
        }

        let currentLevel = 0;
        let scionBody;
        let waterReleased = false;
        let levelActive = true;

        function initLevel(idx) {
            levelActive = true;
            waterReleased = false;
            World.clear(engine.world);
            
            // Scion (Goal)
            scionBody = Bodies.rectangle(levels[idx].scion.x, levels[idx].scion.y, 100, 100, {
                isStatic: true,
                isSensor: true,
                label: 'scion',
                render: { sprite: { texture: SPRITES.normal, xScale: 0.25, yScale: 0.25 } }
            });

            // Pipe (Source)
            const pipe = Bodies.rectangle(levels[idx].pipe.x, levels[idx].pipe.y, 60, 30, {
                isStatic: true,
                render: { fillStyle: '#34495e' }
            });

            // Obstacles
            const obstacles = levels[idx].obs.map(o => {
                return Bodies.rectangle(o.x, o.y, o.w, o.h, { 
                    isStatic: true, 
                    angle: o.angle,
                    render: { fillStyle: '#A04000' } 
                });
            });

            World.add(engine.world, [scionBody, pipe, ...obstacles]);
            document.getElementById('lvl-display').innerText = 'Level ' + (idx + 1);
        }

        // --- FIXED DRAWING MECHANIC ---
        let drawing = false;
        
        render.canvas.addEventListener('mousedown', () => drawing = true);
        render.canvas.addEventListener('mouseup', () => drawing = false);
        render.canvas.addEventListener('mousemove', (e) => {
            if(drawing && levelActive) {
                const linePart = Bodies.circle(e.clientX, e.clientY, 8, {
                    isStatic: true,
                    label: 'line',
                    render: { fillStyle: '#FFF' }
                });
                World.add(engine.world, linePart);
            }
        });

        // --- ACTION: WATER ---
        function releaseWater() {
            if(!levelActive || waterReleased) return;
            waterReleased = true;
            
            // Scion Open Mouth Animation
            scionBody.render.sprite.texture = SPRITES.happy;

            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const drop = Bodies.circle(levels[currentLevel].pipe.x, levels[currentLevel].pipe.y, 6, {
                        restitution: 0.3,
                        label: 'water',
                        render: { fillStyle: '#3498db' }
                    });
                    World.add(engine.world, drop);
                }, i * 100);
            }
            
            // Check for loss after water stops
            setTimeout(checkLoss, 4000);
        }

        // --- WIN/LOSS LOGIC ---
        let collectedWater = 0;
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if(pair.bodyA.label === 'scion' && pair.bodyB.label === 'water') {
                    collectedWater++;
                    Composite.remove(engine.world, pair.bodyB);
                    
                    if(collectedWater >= 10 && levelActive) {
                        levelActive = false;
                        setTimeout(nextLevel, 1000);
                    }
                }
            });
        });

        function checkLoss() {
            if(collectedWater < 10 && levelActive) {
                levelActive = false;
                scionBody.render.sprite.texture = SPRITES.crying;
                // Add crying animation here
            }
        }

        function nextLevel() {
            currentLevel++;
            collectedWater = 0;
            if(currentLevel < levels.length) {
                initLevel(currentLevel);
            } else {
                alert("You beat all levels!");
            }
        }

        Render.run(render);
        Runner.run(Runner.create(), engine);
        initLevel(0);
    </script>
</body>
</html>
